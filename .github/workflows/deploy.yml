name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip Create Link Function
        run: |
          cd src/backend/create_link
          zip -r function.zip .
          
      - name: Deploy Create Link Function
        run: |
          aws lambda update-function-code --function-name ${{ secrets.LAMBDA_CREATE_FUNCTION_NAME }} --zip-file fileb://src/backend/create_link/function.zip

      - name: Zip Redirect Function
        run: |
          cd src/backend/redirect
          zip -r function.zip .
          
      - name: Deploy Redirect Function
        run: |
          aws lambda update-function-code --function-name ${{ secrets.LAMBDA_REDIRECT_FUNCTION_NAME }} --zip-file fileb://src/backend/redirect/function.zip

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./src/frontend s3://${{ secrets.S3_BUCKET_NAME }} --delete
